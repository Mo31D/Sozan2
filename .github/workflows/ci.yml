name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate modular D1 schema
        run: |
          python3 - <<'PY'
          import pathlib
          import sqlite3

          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          for migration in sorted(pathlib.Path('migrations').glob('*.sql')):
              db.executescript(migration.read_text(encoding='utf-8'))

          expected = {
              'core_schema_meta',
              'core_users',
              'core_auth_credentials',
              'core_workspaces',
              'core_workspace_members',
              'core_workspace_modules',
              'core_workspace_labels',
              'core_workspace_settings',
              'core_surface_layouts',
              'core_activity_events',
              'core_idempotency_keys',
              'tutoring_students',
              'tutoring_recurring_sessions',
              'tutoring_session_students',
              'tutoring_occurrences',
              'tutoring_billing_plans',
              'tutoring_billing_cycles',
              'tutoring_billing_cycle_occurrences',
              'finance_receipts',
              'finance_receipt_allocations',
              'finance_expenses',
              'finance_other_income',
              'finance_cash_checks',
          }
          actual = {
              row[0]
              for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )
          }
          missing = expected - actual
          if missing:
              raise SystemExit(f'Missing schema tables: {sorted(missing)}')

          forbidden_legacy = {
              'students', 'recurring_sessions', 'lesson_occurrences', 'payments',
              'receipts', 'activity_log', 'settings', 'student_billing_v6',
              'package_cycles_v6', 'mutation_dedupe_v1'
          }
          present_legacy = forbidden_legacy & actual
          if present_legacy:
              raise SystemExit(f'Legacy tables leaked into Sozan2: {sorted(present_legacy)}')

          # The initial cloud database must not seed a personal user/workspace.
          if db.execute('SELECT COUNT(*) FROM core_users').fetchone()[0] != 0:
              raise SystemExit('Initial schema must be user-neutral')
          if db.execute('SELECT COUNT(*) FROM core_workspaces').fetchone()[0] != 0:
              raise SystemExit('Initial schema must not create a personal workspace')

          db.execute(
              "INSERT INTO core_workspaces(id, name, template_key) VALUES ('ws-ci', 'CI', 'tutoring')"
          )

          # Pending tutoring schedules may be missing day/time.
          db.execute(
              "INSERT INTO tutoring_recurring_sessions(id, workspace_id, title, session_type, schedule_status) "
              "VALUES ('session-pending', 'ws-ci', 'pending', 'online', 'pending')"
          )

          # Confirmed schedules must have both weekday and time.
          try:
              db.execute(
                  "INSERT INTO tutoring_recurring_sessions(id, workspace_id, title, session_type, schedule_status) "
                  "VALUES ('session-broken', 'ws-ci', 'broken', 'online', 'confirmed')"
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('Confirmed tutoring schedule invariant is not enforced')

          # Workspace foreign keys must reject orphan module data.
          try:
              db.execute(
                  "INSERT INTO tutoring_students(id, workspace_id, name) "
                  "VALUES ('student-orphan', 'missing-workspace', 'orphan')"
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('Workspace isolation foreign key is not enforced')

          print('Modular D1 schema validated')
          PY
      - run: npm run check
      - run: npm run build
